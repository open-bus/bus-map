<!DOCTYPE html>
<html>
  <head>
    <title>Open Bus Albania - Live Map</title>
    <meta charset="utf-8" />
    <style>
      html, body { height: 100%; margin: 0; padding: 0; }
      #map { height: 100%; }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script>
      let map, markerBlue, markerRed;

      const KML_URL = 'https://open-bus.github.io/bus-map/tirana-tour.kml';
      const API_BLUE = 'https://tracksolid-proxy.onrender.com/location?imei=862798051314108';
      const API_RED = 'https://tracksolid-proxy.onrender.com/location?imei=862798051314033';

      function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
          center: { lat: 41.3275, lng: 19.8189 },
          zoom: 13,
        });

        // Load the KML route
        new google.maps.KmlLayer({
          url: KML_URL,
          map: map,
          preserveViewport: true,
        });

        // Bus icons
        markerBlue = new google.maps.Marker({
          map: map,
          icon: "https://maps.google.com/mapfiles/kml/shapes/bus.png",
        });

        markerRed = new google.maps.Marker({
          map: map,
          icon: "http://maps.google.com/mapfiles/ms/icons/red-dot.png",
        });

        // Start updating
        updateMarkers();
        setInterval(updateMarkers, 10000);
      }

      async function fetchPosition(url) {
        try {
          const res = await fetch(url);
          const data = await res.json();
          return data;
        } catch {
          return null;
        }
      }

      async function updateMarkers() {
        const blueData = await fetchPosition(API_BLUE);
        const redData = await fetchPosition(API_RED);

        if (blueData?.lat && blueData?.lng) {
          markerBlue.setPosition({ lat: blueData.lat, lng: blueData.lng });
        }

        if (redData?.lat && redData?.lng) {
          markerRed.setPosition({ lat: redData.lat, lng: redData.lng });
        }
      }
    </script>

    <script async
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDcOwNMc5bmnN61hHrR3c5wbxDbFc-QyYc&callback=initMap">
    </script>
  </body>
</html>
