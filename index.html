<!DOCTYPE html>
<html>
  <head>
    <title>Open Bus Albania - Live Map</title>
    <meta charset="utf-8" />
    <style>
      html, body { height: 100%; margin: 0; padding: 0; }
      #map { height: 100%; }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script>
      let map, marker;
      const KML_URL = 'https://open-bus.github.io/bus-map/tirana-tour.kml';
      const LOCATION_API = 'https://tracksolid-proxy.onrender.com/location';

      function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
          center: { lat: 41.3275, lng: 19.8189 },
          zoom: 13,
        });

        // Load the KML route
        new google.maps.KmlLayer({
          url: KML_URL,
          map: map,
          preserveViewport: true,
        });

        // Set up the bus marker
        marker = new google.maps.Marker({
          map: map,
          icon: "https://maps.google.com/mapfiles/kml/shapes/bus.png",
        });

        updateMarker();
        setInterval(updateMarker, 10000);
      }

      async function updateMarker() {
        try {
          const res = await fetch(LOCATION_API);
          const { lat, lng } = await res.json();
          marker.setPosition({ lat, lng });
        } catch (err) {
          console.error('Failed to update marker:', err);
        }
      }
    </script>

    <script async
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDcOwNMc5bmnN61hHrR3c5wbxDbFc-QyYc&callback=initMap">
    </script>
  </body>
</html>
